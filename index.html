<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Jared Ware"/><meta name="description" content="Interactive social media platform for sharing photos with other users"/><meta name="keywords" content="HTML, CSS, social, media, photo, share, user, interactive"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img class="header__logo" src="8650253b58b46f0f1c06.svg" alt="spots logo"/></header><main class="content"><section class="profile page__section"><img src="cd80c45ea7586b1ef02f.jpg" alt="Jared Ware" class="profile__avatar"/><div class="profile__column"><h1 class="profile__name">Jared Ware</h1><p class="profile__description">Aspiring Software Engineer and part-time YouTube content creator</p><button type="button" class="profile__edit-button"><img src="5c2584faa41177b41691.svg" alt="edit icon"/>Edit Profile</button></div><button type="button" class="profile__add-button"><img src="40608da7369d39bc1077.svg" alt="add icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><img src="" alt="" class="card__image"/> <button type="button" class="card__delete-button"></button><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__copyright">2023 &copy; Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="submit" class="modal__close-button"></button><h2 class="modal__title">Edit Profile</h2><form name="edit-profile" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error modal__error_inactive"></span></label> <label for="profile-description-input" class="modal__label">Decription <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error modal__error_inactive"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="submit" class="modal__close-button"></button><h2 class="modal__title">New Post</h2><form name="new-post" class="modal__form" novalidate><label for="image-link-input" class="modal__label">Image Link <input id="image-link-input" type="url" name="link" class="modal__input" placeholder="Past a link to the picture" required/> <span id="image-link-input-error" class="modal__error modal__error_inactive"></span></label> <label for="caption-input" class="modal__label">Caption <input id="caption-input" name="caption" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="caption-input-error" class="modal__error modal__error_inactive"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="preview-modal"><div class="modal__container modal__container_type_preview"><img class="modal__image" src="" alt=""/> <button aria-label="Close modal" class="modal__close-button modal__close-button_type_preview" type="button"></button><p class="modal__caption"></p></div></div></div></body></html>
