<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Jared Ware"/><meta name="description" content="Interactive social media platform for sharing photos with other users"/><meta name="keywords" content="HTML, CSS, social, media, photo, share, user, interactive"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img class="header__logo" src="8bd92903aece9fed9ac5.svg" alt="spots logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><button class="profile__avatar-button"><img class="profile__pencil-icon" src="c81b22e9874268723f8d.svg" alt="edit icon"/></button> <img src="cd80c45ea7586b1ef02f.jpg" alt="Jared Ware" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name"></h1><p class="profile__description"></p><button type="button" class="profile__edit-button"><img src="fb9a3a6b8ef5e2509390.svg" alt="edit icon"/>Edit Profile</button></div><button type="button" class="profile__add-button"><img src="975792ea68af0a3c209d.svg" alt="add icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><img src="" alt="" class="card__image"/> <button type="button" class="card__delete-button"></button><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__copyright">2023 &copy; Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="submit" class="modal__close-button"></button><h2 class="modal__title">Edit Profile</h2><form name="edit-profile" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error modal__error_inactive"></span></label> <label for="profile-description-input" class="modal__label">Decription <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error modal__error_inactive"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="submit" class="modal__close-button"></button><h2 class="modal__title">New Post</h2><form name="new-post" class="modal__form" novalidate><label for="image-link-input" class="modal__label">Image Link <input id="image-link-input" type="url" name="link" class="modal__input" placeholder="Past a link to the picture" required/> <span id="image-link-input-error" class="modal__error modal__error_inactive"></span></label> <label for="caption-input" class="modal__label">Caption <input id="caption-input" name="caption" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="caption-input-error" class="modal__error modal__error_inactive"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="preview-modal"><div class="modal__container modal__container_type_preview"><img class="modal__image" src="" alt=""/> <button aria-label="Close modal" class="modal__close-button modal__close-button_type_preview" type="button"></button><p class="modal__caption"></p></div></div><div class="modal" id="edit-avatar-modal"><div class="modal__container"><button type="submit" class="modal__close-button"></button><h2 class="modal__title">Edit Profile Avatar</h2><form name="edit-avatar" class="modal__form" novalidate><label for="profile-avatar-input" class="modal__label">Profile Picture <input id="profile-avatar-input" name="avatar" type="url" class="modal__input" placeholder="Paste the link to an image" required/> <span id="profile-avatar-input-error" class="modal__error modal__error_inactive"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container modal__container_type_delete"><button type="submit" class="modal__close-button modal__close-button_type_preview"></button><h2 class="modal__title modal__title_type_delete">Are you sure you want to delete this image?</h2><form name="delete-form" class="modal__form" novalidate><div class="modal__actions_type_delete"><button type="submit" class="modal__submit-button modal__submit-button_type_delete">Delete</button> <button type="button" class="modal__submit-button modal__submit-button_type_cancel">Cancel</button></div></form></div></div></div></body></html>
